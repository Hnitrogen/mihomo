mixed-port: 7891
allow-lan: true
bind-address: '*'
mode: rule
log-level: debug

# 简单的测试代理配置
proxies:
  - name: "test-proxy"
    type: ss
    server: 127.0.0.1
    port: 1080
    cipher: aes-256-gcm
    password: test-password

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - test-proxy
      - DIRECT
  
  - name: "VIP_PROXY"
    type: select
    proxies:
      - test-proxy
      - DIRECT

rules:
  # 基于 HTTP 请求头的路由规则
  - HTTP-HEADER,proxy_user_id:vip_user,VIP_PROXY
  - HTTP-HEADER,proxy_user_id,PROXY
  
  # 测试域名
  - DOMAIN-SUFFIX,httpbin.org,PROXY
  - DOMAIN-SUFFIX,google.com,PROXY
  
  # 本地直连
  - GEOIP,CN,DIRECT
  - GEOIP,LAN,DIRECT
  
  # 默认规则
  - MATCH,PROXY